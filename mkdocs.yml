site_name: Rath RPG
site_description: A tabletop RPG system based on Knave
site_url: https://rathrpg.github.io/rath-rpg/

theme:
  name: material
  palette:
    # Light mode (default)
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Crimson Pro
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.tabs.link

nav:
  - Home: index.md
  - Core Rules:
    - Players Handbook: Players Handbook.md
    - GM Handbook: GM Handbook.md
  - Settings:
    - Modern: Modern.md
    - Science Fiction: Science Fiction.md
  - Advanced Rules:
    - Advanced Aptitudes: Advanced Aptitudes.md
    - Advanced Magic: Advanced Magic.md
  - Other Ways to Play:
    - Rath Overdrive: Rath Overdrive.md
    - Rath Freehand: Rath Freehand.md
  - Reference:
    - Homebrew Guide: Homebrew Guide.md
    - Downloads: downloads.md
    - License: License and Attribution.md

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - js/rath-data.js

plugins:
  - search
